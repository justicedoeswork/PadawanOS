<!--
  Gateway-only presentation copy of ../justiceos-mark-color.svg.

  The supplied artwork's visible content (measured via getBBox() in a real
  browser) sits at x=64 y=32.06 w=347 h=428.94 inside a 0..512 / 0..512
  viewBox: 64px of transparent padding on the left but 101px on the
  right, and 32px on top but 51px on the bottom. Every consumer renders
  this file at a uniform width/height (an <img> box, or a CSS width with
  height:auto), so that asymmetric internal padding reads as the wizard
  mark sitting visibly left-and-up of center in its own square, no matter
  how well the surrounding CSS container itself is centered.

  This copy changes ONLY the viewBox's min-x/min-y (no path data touched,
  nothing redrawn, recolored, stretched, or cropped: the same paths, same
  colors, same 512x512 scale, just a re-aimed 512x512 window over them)
  so the content's own bounding box is centered in the frame:
    new minX = contentCenterX - 512/2 = (64 + 347/2) - 256 = -18.5
    new minY = contentCenterY - 512/2 = (32.06 + 428.94/2) - 256 = -9.47
  This shifts the WHOLE mark (hat, spark, face, beard, glyph: one
  coordinate space, one shift) as a single unit; nothing is re-centered
  piece by piece. (Note for future editors: XML comments must never
  contain a double hyphen, so this note avoids the double-hyphen dash
  style used elsewhere in this codebase's JS/CSS comments.)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-18.5 -9.47 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JusticeOS wizard mark</title>
  <desc id="desc">Violet wizard with an aqua spark and terminal glyph</desc>
